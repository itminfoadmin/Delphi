<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>델파이 설문 일정 관리</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600;700&family=Noto+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    :root{--ink:#1a1a2e;--ink-mid:#3d3d5c;--ink-soft:#6b6b8a;--accent:#4a6fa5;--accent-lt:#e8edf5;--divider:#d0d5e0;--bg:#f4f5f8;--card-bg:#fff;--green:#5a9a6e;--red:#d9534f}
    body{font-family:'Noto Sans KR','Malgun Gothic',sans-serif;background:var(--bg);min-height:100vh;padding:32px 24px 60px}

    /* ── 상단 바 ── */
    .top-bar{display:flex;justify-content:flex-end;align-items:center;gap:10px;margin-bottom:20px;max-width:860px;margin-left:auto;margin-right:auto;flex-wrap:wrap}
    .top-bar-title{font-family:'Noto Serif KR',serif;font-size:24px;font-weight:700;color:var(--ink);margin-right:auto;white-space:nowrap}
    .btn-hdr{padding:10px 22px;font-size:14px;font-weight:600;border:none;border-radius:4px;cursor:pointer;transition:all .2s;white-space:nowrap}
    .btn-reload{background:var(--accent);color:#fff}
    .btn-reload:hover{background:#3a5c8f}
    .btn-back{background:#e8e8e8;color:var(--ink);border:1.5px solid var(--divider)!important}
    .btn-back:hover{background:#d5d5d5}

    /* ── 카드 ── */
    .card-wrap{max-width:860px;margin:0 auto}
    .period-card{background:var(--card-bg);border:1px solid var(--divider);border-radius:6px;overflow:hidden;margin-bottom:16px}
    .period-header{display:flex;align-items:center;padding:14px 24px;background:var(--accent-lt);border-bottom:1px solid var(--divider);gap:12px}
    .period-round{font-family:'Noto Serif KR',serif;font-size:16px;font-weight:700;color:var(--ink);min-width:140px}
    .period-badge{font-size:11px;font-weight:600;padding:3px 10px;border-radius:12px;white-space:nowrap}
    .badge-before{background:#f0f0f0;color:var(--ink-soft)}
    .badge-active{background:#ddeee3;color:var(--green)}
    .badge-ended{background:#e2e2ea;color:var(--ink-mid)}
    .badge-none{background:#fff5f5;color:var(--red)}
    .period-spacer{flex:1}
    .btn-edit-period{font-size:12px;font-weight:600;padding:6px 16px;background:#fff;color:var(--accent);border:1px solid var(--accent);border-radius:4px;cursor:pointer;transition:all .15s}
    .btn-edit-period:hover{background:var(--accent);color:#fff}

    .period-body{display:flex;align-items:center;padding:18px 24px;gap:32px;flex-wrap:wrap}
    .date-group{display:flex;align-items:center;gap:8px}
    .date-label{font-size:13px;font-weight:600;color:var(--ink-soft);min-width:50px}
    .date-value{font-size:15px;font-weight:600;color:var(--ink);min-width:140px}
    .date-value.empty{color:#ccc;font-weight:400;font-style:italic}
    .date-arrow{font-size:20px;color:var(--divider);margin:0 8px}
    .period-duration{font-size:12px;color:var(--ink-soft);margin-left:auto}

    /* ── 모달 ── */
    .modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.38);z-index:1000;align-items:center;justify-content:center}
    .modal-overlay.active{display:flex}
    .modal-box{background:#fff;border-radius:6px;padding:32px 36px 28px;width:480px;max-width:94vw;box-shadow:0 8px 32px rgba(0,0,0,.18)}
    .modal-box h3{font-size:16px;color:var(--ink);margin-bottom:20px;font-weight:600}
    .modal-field{margin-bottom:16px}
    .modal-field label{display:block;font-size:13px;font-weight:600;color:var(--ink-mid);margin-bottom:6px}
    .modal-field input[type="date"]{width:100%;padding:10px 14px;font-size:14px;font-family:inherit;border:1.5px solid var(--divider);border-radius:4px;outline:none;transition:border-color .2s}
    .modal-field input[type="date"]:focus{border-color:var(--accent)}
    .modal-actions{display:flex;gap:10px;margin-top:24px}
    .modal-actions button{flex:1;padding:12px 0;font-size:14px;font-weight:600;border-radius:4px;cursor:pointer;transition:opacity .2s}
    .modal-actions button:hover{opacity:.85}
    .modal-cancel{background:#fff;border:1.5px solid #ccc;color:#333}
    .modal-confirm{background:var(--accent);border:none;color:#fff}
    .modal-confirm:disabled{opacity:.5;cursor:default}
    .modal-msg{font-size:13px;margin-top:10px;min-height:18px;text-align:center}
    .modal-msg.ok{color:var(--green)}
    .modal-msg.err{color:var(--red)}
    .btn-clear{font-size:12px;color:var(--red);background:none;border:1px solid var(--red);border-radius:4px;padding:4px 12px;cursor:pointer;transition:all .15s;margin-top:8px}
    .btn-clear:hover{background:#fde8e8}

    /* ── 로딩 ── */
    #loadingOverlay{display:none;position:fixed;inset:0;background:var(--bg);z-index:2000;align-items:center;justify-content:center;flex-direction:column;gap:28px}
    #loadingOverlay.active{display:flex}
    .loading-dots{display:flex;align-items:center;gap:10px}
    .loading-dots span{width:14px;height:14px;border-radius:50%;animation:bounce .6s ease-in-out infinite alternate}
    .loading-dots span:nth-child(1){animation-delay:0s;background:#4a6fa5}
    .loading-dots span:nth-child(2){animation-delay:.15s;background:#5a9a6e}
    .loading-dots span:nth-child(3){animation-delay:.3s;background:#8b6fb0}
    .loading-dots span:nth-child(4){animation-delay:.45s;background:#4a6fa5}
    @keyframes bounce{0%{transform:translateY(0);opacity:.4}100%{transform:translateY(-18px);opacity:1}}
    .loading-text{font-size:14px;color:var(--ink-soft);animation:pulse-text 1.6s ease-in-out infinite}
    @keyframes pulse-text{0%,100%{opacity:.5}50%{opacity:1}}

    .toast{position:fixed;bottom:40px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 28px;border-radius:6px;font-size:14px;font-weight:500;box-shadow:0 4px 16px rgba(0,0,0,.2);opacity:0;transition:opacity .3s;z-index:3000;pointer-events:none}
    .toast.show{opacity:1}
  </style>
</head>
<body>

  <div id="loadingOverlay">
    <div class="loading-dots"><span></span><span></span><span></span><span></span></div>
    <span class="loading-text">일정 데이터를 불러오는 중...</span>
  </div>

  <!-- 일정 수정 모달 -->
  <div class="modal-overlay" id="editOverlay">
    <div class="modal-box">
      <h3 id="editTitle">설문 일정 수정</h3>
      <div class="modal-field">
        <label for="editStart">시작 일자</label>
        <input type="date" id="editStart" />
      </div>
      <div class="modal-field">
        <label for="editEnd">종료 일자</label>
        <input type="date" id="editEnd" />
      </div>
      <button class="btn-clear" id="editClear">일정 초기화 (비우기)</button>
      <div class="modal-msg" id="editMsg"></div>
      <div class="modal-actions">
        <button class="modal-cancel" id="editCancel">취소</button>
        <button class="modal-confirm" id="editConfirm">저장</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <!-- 상단 바 -->
  <div class="top-bar">
    <span class="top-bar-title">델파이 설문 일정 관리</span>
    <button class="btn-hdr btn-reload" id="btnReload">새로고침</button>
    <button class="btn-hdr btn-back" id="btnBack">관리자 메뉴로 가기</button>
  </div>

  <!-- 카드 목록 -->
  <div class="card-wrap" id="cardWrap"></div>

<script>
  const GAS_URL = 'https://script.google.com/macros/s/AKfycbws4BreiIVwWoUrySkQCG3pFhy3tiY8fXgRgPCSlYdvIpoXrpLwwoD3WuhJHFZllG03nw/exec';

  const ROUND_LABELS = ['1차 델파이', '2차 델파이', '3차 델파이', '4차 델파이', '5차 델파이'];
  const ROUND_KEYS   = ['1st_delphi', '2nd_delphi', '3rd_delphi', '4th_delphi', '5th_delphi'];

  let periods = []; // [{no, start, end}, ...]

  function showToast(m, d=2000) { const t=document.getElementById('toast'); t.textContent=m; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),d); }
  function showLoading(v) { document.getElementById('loadingOverlay').classList.toggle('active',v); }

  async function gasCall(payload) {
    const res = await fetch(GAS_URL, { method:'POST', headers:{'Content-Type':'text/plain'}, body:JSON.stringify(payload) });
    const t = await res.text();
    try { return JSON.parse(t); } catch { return { status:'error', message: t }; }
  }

  /* ── 데이터 로드 ── */
  async function loadAll() {
    showLoading(true);
    try {
      const result = await gasCall({ action: 'getDelphiPeriods' });
      if (result.status !== 'ok') throw new Error(result.message);
      periods = result.periods || [];
      renderCards();
    } catch(e) {
      document.getElementById('cardWrap').innerHTML = `<div style="text-align:center;padding:40px;color:var(--ink-soft)">데이터 로드 실패: ${e.message}</div>`;
    } finally { showLoading(false); }
  }

  /* ── 카드 렌더링 ── */
  function renderCards() {
    const wrap = document.getElementById('cardWrap');
    let html = '';

    ROUND_KEYS.forEach((key, idx) => {
      const p = periods.find(r => r.no === key) || { no: key, start: '', end: '' };
      const label = ROUND_LABELS[idx];
      const startStr = p.start || '';
      const endStr = p.end || '';
      const badge = getBadge(startStr, endStr);
      const duration = getDuration(startStr, endStr);

      html += `<div class="period-card">`;
      html += `  <div class="period-header">`;
      html += `    <span class="period-round">${label}</span>`;
      html += `    <span class="period-badge ${badge.cls}">${badge.text}</span>`;
      html += `    <span class="period-spacer"></span>`;
      html += `    <button class="btn-edit-period" data-key="${key}" data-idx="${idx}">수정</button>`;
      html += `  </div>`;
      html += `  <div class="period-body">`;
      html += `    <div class="date-group">`;
      html += `      <span class="date-label">시작일</span>`;
      html += `      <span class="date-value ${startStr?'':'empty'}">${startStr || '미설정'}</span>`;
      html += `    </div>`;
      html += `    <span class="date-arrow">→</span>`;
      html += `    <div class="date-group">`;
      html += `      <span class="date-label">종료일</span>`;
      html += `      <span class="date-value ${endStr?'':'empty'}">${endStr || '미설정'}</span>`;
      html += `    </div>`;
      if (duration) html += `<span class="period-duration">${duration}</span>`;
      html += `  </div>`;
      html += `</div>`;
    });

    wrap.innerHTML = html;

    // 수정 버튼 이벤트
    wrap.querySelectorAll('.btn-edit-period').forEach(btn => {
      btn.addEventListener('click', () => {
        const key = btn.dataset.key;
        const idx = parseInt(btn.dataset.idx, 10);
        const p = periods.find(r => r.no === key) || { no: key, start: '', end: '' };
        openEditModal(key, idx, p.start, p.end);
      });
    });
  }

  /* ── 뱃지 계산 ── */
  function getBadge(start, end) {
    if (!start && !end) return { text: '미설정', cls: 'badge-none' };
    const today = new Date();
    today.setHours(0,0,0,0);
    if (start) {
      const s = parseDate(start);
      if (s > today) return { text: '예정', cls: 'badge-before' };
    }
    if (end) {
      const e = parseDate(end);
      if (e < today) return { text: '종료', cls: 'badge-ended' };
    }
    if (start) {
      const s = parseDate(start);
      if (s <= today) return { text: '진행중', cls: 'badge-active' };
    }
    return { text: '설정됨', cls: 'badge-before' };
  }

  function parseDate(str) {
    // "2026년 8월 24일" or "2026-08-24" 등 처리
    const m = str.match(/(\d{4})[^\d]+(\d{1,2})[^\d]+(\d{1,2})/);
    if (m) return new Date(parseInt(m[1]),parseInt(m[2])-1,parseInt(m[3]));
    return new Date(str);
  }

  function toInputDate(str) {
    if (!str) return '';
    const d = parseDate(str);
    if (isNaN(d.getTime())) return '';
    return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
  }

  function getDuration(start, end) {
    if (!start || !end) return '';
    const s = parseDate(start);
    const e = parseDate(end);
    if (isNaN(s.getTime()) || isNaN(e.getTime())) return '';
    const diff = Math.round((e - s) / (1000*60*60*24));
    if (diff < 0) return '';
    return `${diff + 1}일간`;
  }

  /* ── 수정 모달 ── */
  let editKey = null;
  const editOverlay = document.getElementById('editOverlay');
  const editMsg = document.getElementById('editMsg');

  function openEditModal(key, idx, start, end) {
    editKey = key;
    document.getElementById('editTitle').textContent = ROUND_LABELS[idx] + ' 일정 수정';
    document.getElementById('editStart').value = toInputDate(start);
    document.getElementById('editEnd').value = toInputDate(end);
    editMsg.textContent = ''; editMsg.className = 'modal-msg';
    editOverlay.classList.add('active');
  }

  document.getElementById('editCancel').addEventListener('click', () => { editOverlay.classList.remove('active'); editKey=null; });
  editOverlay.addEventListener('click', e => { if(e.target===editOverlay){ editOverlay.classList.remove('active'); editKey=null; } });

  document.getElementById('editClear').addEventListener('click', () => {
    document.getElementById('editStart').value = '';
    document.getElementById('editEnd').value = '';
  });

  document.getElementById('editConfirm').addEventListener('click', async () => {
    if (!editKey) return;
    const startVal = document.getElementById('editStart').value;
    const endVal = document.getElementById('editEnd').value;

    // 유효성: 종료일이 시작일보다 이전이면 경고
    if (startVal && endVal && endVal < startVal) {
      editMsg.textContent = '종료일이 시작일보다 이전입니다.';
      editMsg.className = 'modal-msg err';
      return;
    }

    const btn = document.getElementById('editConfirm');
    btn.disabled = true; btn.textContent = '저장 중…'; editMsg.textContent = '';

    try {
      const result = await gasCall({
        action: 'updateDelphiPeriod',
        key: editKey,
        start: startVal || '',
        end: endVal || ''
      });
      if (result.status === 'ok') {
        editMsg.textContent = '저장되었습니다.'; editMsg.className = 'modal-msg ok';
        // 로컬 데이터 갱신
        const p = periods.find(r => r.no === editKey);
        if (p) { p.start = result.start || ''; p.end = result.end || ''; }
        else periods.push({ no: editKey, start: result.start||'', end: result.end||'' });
        renderCards();
        setTimeout(() => { editOverlay.classList.remove('active'); editKey=null; }, 800);
      } else {
        editMsg.textContent = '저장 실패: ' + result.message; editMsg.className = 'modal-msg err';
      }
    } catch(e) {
      editMsg.textContent = '오류: ' + e.message; editMsg.className = 'modal-msg err';
    } finally {
      btn.disabled = false; btn.textContent = '저장';
    }
  });

  /* ── 네비게이션 ── */
  document.getElementById('btnReload').addEventListener('click', () => loadAll());
  document.getElementById('btnBack').addEventListener('click', () => { location.href = 'admin_mng-intro.html'; });
  document.addEventListener('keydown', e => { if(e.key==='Escape') { editOverlay.classList.remove('active'); editKey=null; } });

  loadAll();
</script>
</body>
</html>
