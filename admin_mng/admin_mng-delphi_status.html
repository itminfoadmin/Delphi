<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>델파이 설문 현황</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600;700&family=Noto+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --ink:#1a1a2e;--ink-mid:#3d3d5c;--ink-soft:#6b6b8a;
      --accent:#4a6fa5;--accent-lt:#e8edf5;--divider:#d0d5e0;
      --bg:#f4f5f8;--card-bg:#fff;--green:#5a9a6e;--red:#d9534f;
    }

    body {
      font-family: 'Noto Sans KR', 'Malgun Gothic', sans-serif;
      background: var(--bg); min-height: 100vh; padding: 32px 24px 60px;
    }

    /* ── 상단 바 ── */
    .top-bar {
      display: flex; justify-content: flex-end; align-items: center;
      gap: 10px; margin-bottom: 20px; max-width: 1134px; margin-left: auto; margin-right: auto; flex-wrap:wrap;
    }
    .top-bar-title {
      font-family: 'Noto Serif KR', serif;
      font-size: 24px; font-weight: 700; color: var(--ink); margin-right: auto; white-space: nowrap;
    }
    .top-bar-email {
      font-size: 13px; color: var(--ink-soft); margin-right: 6px;
      padding: 7px 4px;
    }
    .btn-hdr {
      padding: 10px 22px; font-size: 14px; font-weight: 600;
      border: none; border-radius: 4px;
      cursor: pointer; transition: all .2s; white-space: nowrap;
    }
    .btn-add-panel { background: var(--green); color: #fff; }
    .btn-add-panel:hover { background: #488a5a; }
    .btn-reload { background: var(--accent); color: #fff; }
    .btn-reload:hover { background: #3a5c8f; }
    .btn-back { background: #e8e8e8; color: var(--ink); border: 1.5px solid var(--divider) !important; }
    .btn-back:hover { background: #d5d5d5; }

    /* ── 테이블 ── */
    .table-wrap { overflow-x: auto; max-width: 1134px; margin: 0 auto; }
    table {
      width: 100%; border-collapse: collapse;
      font-size: 13px; background: var(--card-bg);
      border: 1px solid var(--divider); border-radius: 6px; overflow: hidden;
    }
    th, td { border: 1px solid var(--divider); text-align: center; vertical-align: middle; padding: 0; }
    th:last-child, td:last-child { border-right: none; }

    .th-title {
      font-family: 'Noto Serif KR', serif;
      font-size: 14px; font-weight: 700; padding: 14px 12px;
      background: var(--accent-lt); color: var(--ink);
    }

    .th-survey {
      font-size: 12px; font-weight: 700; padding: 8px 4px;
      background: var(--accent-lt); color: var(--ink); text-align: center;
    }

    .th-edit {
      font-size: 12px; font-weight: 700; padding: 8px 8px;
      background: var(--accent-lt); color: var(--ink); min-width: 70px;
    }

    .btn-save-all { background: var(--accent); color: #fff; text-align: center; }
    .btn-save-all:hover { background: #3a5c8f; }
    .btn-save-all:disabled { opacity: .5; cursor: default; }

    /* ── 세그먼트 컨트롤 (헤더) ── */
    .seg-ctrl {
      display: flex; flex-direction: column; border: 1px solid var(--divider);
      border-radius: 4px; overflow: hidden; width: 100%;
    }
    .seg-ctrl .seg-label {
      font-size: 11px; font-weight: 600; color: var(--ink-soft);
      padding: 4px 0; text-align: center;
      background: var(--accent-lt); border-bottom: 1px solid var(--divider);
    }
    .seg-ctrl .seg-btns { display: flex; }
    .seg-ctrl .seg-btn {
      flex: 1; padding: 7px 2px; font-size: 11px; font-weight: 600;
      cursor: pointer; border: none; background: var(--card-bg);
      color: var(--ink-soft); transition: all .15s;
    }
    .seg-ctrl .seg-btn:not(:last-child) { border-right: 1px solid var(--divider); }
    .seg-ctrl .seg-btn:hover { background: #f0f2f6; }
    .seg-ctrl .seg-btn.active-wait { background: #dce6f3; color: var(--accent); }
    .seg-ctrl .seg-btn.active-proc { background: #ddeee3; color: var(--green); }
    .seg-ctrl .seg-btn.active-done { background: #e2e2ea; color: var(--ink); }

    /* ── 세그먼트 컨트롤 (모달) ── */
    .seg-ctrl-modal {
      display: inline-flex; border: 1px solid var(--divider); border-radius: 4px;
      overflow: hidden; width: 100%;
    }
    .seg-ctrl-modal .seg-btn {
      flex: 1; padding: 10px 4px; font-size: 13px; font-weight: 600;
      cursor: pointer; border: none; background: var(--card-bg);
      color: var(--ink-soft); transition: all .15s;
    }
    .seg-ctrl-modal .seg-btn:not(:last-child) { border-right: 1px solid var(--divider); }
    .seg-ctrl-modal .seg-btn:hover { background: #f0f2f6; }
    .seg-ctrl-modal .seg-btn.active-wait { background: #dce6f3; color: var(--accent); }
    .seg-ctrl-modal .seg-btn.active-proc { background: #ddeee3; color: var(--green); }
    .seg-ctrl-modal .seg-btn.active-done { background: #e2e2ea; color: var(--ink); }

    /* ── 데이터 행 ── */
    .td-panel, .td-email {
      font-size: 12px; color: var(--ink-mid); padding: 11px 8px;
      background: var(--card-bg); white-space: nowrap;
    }

    .td-status {
      padding: 11px 0; background: var(--card-bg);
    }
    .status-text { font-size: 12px; font-weight: 500; }
    .status-text.waiting    { color: var(--accent); }
    .status-text.proceeding { color: var(--green); }
    .status-text.complete   { color: var(--ink); font-weight: 700; }

    /* 패널 수정/삭제 버튼 */
    .td-action { padding: 8px 6px; background: var(--card-bg); white-space: nowrap; min-width: 70px; }
    .btn-modify {
      width: 36px; height: 24px; font-size: 11px; font-weight: 600;
      background: var(--card-bg); color: var(--accent);
      border: 1px solid var(--accent); border-radius: 4px;
      cursor: pointer; transition: all .15s; margin-right: 3px; overflow: hidden;
    }
    .btn-modify:hover { background: var(--accent-lt); }
    .btn-delete {
      width: 36px; height: 24px; font-size: 11px; font-weight: 600;
      background: var(--card-bg); color: var(--red);
      border: 1px solid var(--red); border-radius: 4px;
      cursor: pointer; transition: all .15s; overflow: hidden;
    }
    .btn-delete:hover { background: #fde8e8; }

    .state-row td { padding: 36px; color: var(--ink-soft); font-size: 13px; }

    /* ── 로딩 오버레이 ── */
    #loadingOverlay {
      display: none; position: fixed; inset: 0;
      background: var(--bg); z-index: 2000;
      align-items: center; justify-content: center;
      flex-direction: column; gap: 28px;
    }
    #loadingOverlay.active { display: flex; }
    .loading-dots{display:flex;align-items:center;gap:10px}
    .loading-dots span{width:14px;height:14px;border-radius:50%;animation:bounce .6s ease-in-out infinite alternate}
    .loading-dots span:nth-child(1){animation-delay:0s;background:#4a6fa5}
    .loading-dots span:nth-child(2){animation-delay:.15s;background:#5a9a6e}
    .loading-dots span:nth-child(3){animation-delay:.3s;background:#8b6fb0}
    .loading-dots span:nth-child(4){animation-delay:.45s;background:#4a6fa5}
    @keyframes bounce{0%{transform:translateY(0);opacity:.4}100%{transform:translateY(-18px);opacity:1}}
    .loading-bar-wrap{width:200px;height:4px;background:#e0e3ea;border-radius:4px;overflow:hidden}
    .loading-bar-inner{width:40%;height:100%;background:linear-gradient(90deg,#4a6fa5,#5a9a6e,#8b6fb0);border-radius:4px;animation:slide 1.4s ease-in-out infinite}
    @keyframes slide{0%{transform:translateX(-100%)}50%{transform:translateX(150%)}100%{transform:translateX(-100%)}}
    .loading-text { font-size: 14px; color: var(--ink-soft); animation:pulse-text 1.6s ease-in-out infinite; }
    @keyframes pulse-text{0%,100%{opacity:.5}50%{opacity:1}}

    /* ── 공통 모달 ── */
    .overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,.38); z-index: 1000;
      align-items: center; justify-content: center;
    }
    .overlay.active { display: flex; }
    .modal-box {
      background: var(--card-bg); border-radius: 6px;
      padding: 36px 40px 30px; width: 400px; max-width: 94vw;
      box-shadow: 0 8px 32px rgba(0,0,0,.18);
    }
    .modal-box h3 { font-size: 16px; color: var(--ink); margin-bottom: 22px; font-weight: 700; }
    .field-wrap { margin-bottom: 14px; }
    .field-wrap label { display: block; font-size: 12px; color: var(--ink-soft); margin-bottom: 5px; font-weight: 500; }
    .field-wrap input[type="email"],
    .field-wrap input[type="text"] {
      width: 100%; border: 1px solid var(--divider); border-radius: 4px;
      padding: 9px 12px; font-size: 14px; font-family: inherit; outline: none;
      transition: border-color .2s; background: #fafbfc;
    }
    .field-wrap input:focus { border-color: var(--accent); background: #fff; }
    .field-wrap input[readonly] { background: #f0f0f0; color: var(--ink-soft); cursor: default; }
    .field-wrap select {
      width: 100%; border: 1px solid var(--divider); border-radius: 4px;
      padding: 9px 12px; font-size: 14px; font-family: inherit; outline: none;
      background: #fafbfc; cursor: pointer;
    }
    .field-wrap select:focus { border-color: var(--accent); background: #fff; }
    .modal-msg { font-size: 12px; min-height: 18px; margin-bottom: 12px; }
    .modal-msg.err { color: var(--red); }
    .modal-msg.ok  { color: var(--green); }
    .modal-actions { display: flex; gap: 10px; margin-top: 6px; }
    .modal-actions button {
      flex: 1; padding: 11px 0; font-size: 14px; font-weight: 700;
      border-radius: 4px; cursor: pointer; transition: opacity .2s;
    }
    .modal-actions button:hover { opacity: .85; }
    .modal-actions button:disabled { opacity: .45; cursor: default; }
    .btn-m-cancel  { background: var(--card-bg); border: 1.5px solid var(--divider); color: var(--ink-mid); }
    .btn-m-confirm { background: var(--accent); border: none; color: #fff; }
    .btn-m-delete  { background: var(--red); border: none; color: #fff; }
    .lo-modal {
      background: var(--card-bg); border-radius: 6px;
      padding: 36px 40px 28px; width: 320px; max-width: 92vw;
      box-shadow: 0 8px 32px rgba(0,0,0,.18); text-align: center;
    }
    .lo-modal p { font-size: 15px; color: var(--ink-mid); line-height: 1.7; margin-bottom: 28px; }

    @media(max-width:768px){.top-bar-title{font-size:18px}}
  </style>
</head>
<body>

  <!-- 전체 로딩 오버레이 -->
  <div id="loadingOverlay">
    <div class="loading-dots"><span></span><span></span><span></span><span></span></div>
    <div class="loading-bar-wrap"><div class="loading-bar-inner"></div></div>
    <span class="loading-text">데이터를 불러오는 중...</span>
  </div>

  <!-- 변경사항 없음 모달 -->
  <div class="overlay" id="noChangeOverlay">
    <div class="lo-modal">
      <p>수정된 사항이 없습니다.</p>
      <div class="modal-actions">
        <button class="btn-m-confirm" id="noChangeOk">확인</button>
      </div>
    </div>
  </div>

  <!-- 패널 추가 모달 -->
  <div class="overlay" id="addOverlay">
    <div class="modal-box">
      <h3>패널 추가</h3>
      <div class="field-wrap">
        <label>e-mail *</label>
        <input type="email" id="addEmail" placeholder="이메일 주소를 입력해주세요." />
      </div>
      <div class="field-wrap">
        <label>기타 (etc)</label>
        <input type="text" id="addEtc" placeholder="기타 정보를 입력해주세요. (선택)" />
      </div>
      <p class="modal-msg" id="addMsg"></p>
      <div class="modal-actions">
        <button class="btn-m-cancel"  id="addCancel">취소</button>
        <button class="btn-m-confirm" id="addConfirm">추가</button>
      </div>
    </div>
  </div>

  <!-- 패널 정보 수정 모달 -->
  <div class="overlay" id="modOverlay">
    <div class="modal-box">
      <h3>패널 수정</h3>
      <div class="field-wrap">
        <label>panel_no</label>
        <input type="text" id="modNo" readonly />
      </div>
      <div class="field-wrap">
        <label>e-mail *</label>
        <input type="email" id="modEmail" placeholder="이메일 주소를 입력해주세요." />
      </div>
      <div class="field-wrap">
        <label>기타 (etc)</label>
        <input type="text" id="modEtc" placeholder="기타 정보를 입력해주세요. (선택)" />
      </div>
      <p class="modal-msg" id="modMsg"></p>
      <div class="modal-actions">
        <button class="btn-m-cancel"  id="modCancel">취소</button>
        <button class="btn-m-confirm" id="modConfirm">저장</button>
      </div>
    </div>
  </div>

  <!-- 패널 상태 수정 모달 -->
  <div class="overlay" id="stOverlay">
    <div class="modal-box">
      <h3 id="stTitle">설문 상태 수정</h3>
      <div class="field-wrap">
        <label>panel_no</label>
        <input type="text" id="stNo" readonly />
      </div>
      <div class="field-wrap">
        <label>상태</label>
        <div class="seg-ctrl-modal" id="stSegCtrl">
          <button type="button" class="seg-btn active-wait" data-val="대기">대기</button>
          <button type="button" class="seg-btn" data-val="진행중">진행</button>
          <button type="button" class="seg-btn" data-val="완료">완료</button>
        </div>
      </div>
      <p class="modal-msg" id="stMsg"></p>
      <div class="modal-actions">
        <button class="btn-m-cancel"  id="stCancel">취소</button>
        <button class="btn-m-confirm" id="stConfirm">저장</button>
      </div>
    </div>
  </div>

  <!-- 패널 삭제 확인 모달 -->
  <div class="overlay" id="delOverlay">
    <div class="lo-modal">
      <p id="delMsg">이 패널을 삭제하시겠습니까?</p>
      <div class="modal-actions">
        <button class="btn-m-cancel" id="delCancel">취소</button>
        <button class="btn-m-delete" id="delConfirm">삭제</button>
      </div>
    </div>
  </div>

  <!-- 상단 바 -->
  <div class="top-bar">
    <span class="top-bar-title">델파이 설문 현황</span>
    <span class="top-bar-email" id="topEmail"></span>
    <button class="btn-hdr btn-add-panel" id="btnAddPanel">＋ 패널 추가</button>
    <button class="btn-hdr btn-reload" id="btnReload">새로고침</button>
    <button class="btn-hdr btn-save-all" id="btnSaveAll">변경사항 저장</button>
    <button class="btn-hdr btn-back" id="btnBack">관리자 메뉴로 가기</button>
  </div>

  <!-- 메인 테이블 -->
  <div class="table-wrap">
    <table id="mainTable">
      <thead>
        <tr>
          <th class="th-title" colspan="2">Panel Information</th>
          <th class="th-survey"><div class="seg-ctrl"><span class="seg-label">1차 설문</span><div class="seg-btns" id="hdrSeg1"><button type="button" class="seg-btn active-wait" data-val="대기">대기</button><button type="button" class="seg-btn" data-val="진행중">진행</button><button type="button" class="seg-btn" data-val="완료">완료</button></div></div></th>
          <th class="th-survey"><div class="seg-ctrl"><span class="seg-label">2차 설문</span><div class="seg-btns" id="hdrSeg2"><button type="button" class="seg-btn active-wait" data-val="대기">대기</button><button type="button" class="seg-btn" data-val="진행중">진행</button><button type="button" class="seg-btn" data-val="완료">완료</button></div></div></th>
          <th class="th-survey"><div class="seg-ctrl"><span class="seg-label">3차 설문</span><div class="seg-btns" id="hdrSeg3"><button type="button" class="seg-btn active-wait" data-val="대기">대기</button><button type="button" class="seg-btn" data-val="진행중">진행</button><button type="button" class="seg-btn" data-val="완료">완료</button></div></div></th>
          <th class="th-survey"><div class="seg-ctrl"><span class="seg-label">4차 설문</span><div class="seg-btns" id="hdrSeg4"><button type="button" class="seg-btn active-wait" data-val="대기">대기</button><button type="button" class="seg-btn" data-val="진행중">진행</button><button type="button" class="seg-btn" data-val="완료">완료</button></div></div></th>
          <th class="th-survey"><div class="seg-ctrl"><span class="seg-label">5차 설문</span><div class="seg-btns" id="hdrSeg5"><button type="button" class="seg-btn active-wait" data-val="대기">대기</button><button type="button" class="seg-btn" data-val="진행중">진행</button><button type="button" class="seg-btn" data-val="완료">완료</button></div></div></th>
          <th class="th-edit">수정/삭제</th>
        </tr>
      </thead>
      <tbody id="tableBody">
        <tr class="state-row"><td colspan="8">데이터를 불러오는 중...</td></tr>
      </tbody>
    </table>
  </div>

<script>
  /* ════════════════════════════════
     설정
  ════════════════════════════════ */
  const GAS_URL       = 'https://script.google.com/macros/s/AKfycbws4BreiIVwWoUrySkQCG3pFhy3tiY8fXgRgPCSlYdvIpoXrpLwwoD3WuhJHFZllG03nw/exec';
  const PANEL_CSV     = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRBQ3YJBvAuWfk6oVrVwhrvekjP4PGmoEDO4XvGvexhp8zlDbX2K2o_dHZMHulA4QcvnvoW_PYrgLl3/pub?gid=1627073953&single=true&output=csv';
  const DELPHI_NO_CSV = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRBQ3YJBvAuWfk6oVrVwhrvekjP4PGmoEDO4XvGvexhp8zlDbX2K2o_dHZMHulA4QcvnvoW_PYrgLl3/pub?gid=1701744269&single=true&output=csv';

  const ROUND_LABELS = ['1차 설문', '2차 설문', '3차 설문', '4차 설문', '5차 설문'];
  const DELPHI_KEYS  = ['1st_delphi','2nd_delphi','3rd_delphi','4th_delphi','5th_delphi'];
  const STATUS_KEYS  = ['1st_delphi_status','2nd_delphi_status','3rd_delphi_status','4th_delphi_status','5th_delphi_status'];

  /* 로그인 이메일 표시 */
  const adminEmail = sessionStorage.getItem('adminEmail') || '';
  document.getElementById('topEmail').textContent = adminEmail ? `👤 ${adminEmail}` : '';

  /* ── GAS 호출 ── */
  async function gasCall(payload) {
    const res = await fetch(GAS_URL, {
      method: 'POST', headers: { 'Content-Type': 'text/plain' },
      body: JSON.stringify(payload)
    });
    const text = await res.text();
    try { return JSON.parse(text); }
    catch(e) { return { status: 'error', message: 'GAS 응답 파싱 실패: ' + text }; }
  }

  /* ── CSV 파싱 ── */
  async function fetchCSV(url) {
    const res  = await fetch(url);
    const text = await res.text();
    const lines = text.trim().split(/\r\n|\r|\n/);
    const headers = lines[0].split(',').map(h => h.trim().replace(/^"|"$/g,''));
    return lines.slice(1).filter(l => l.trim() !== '').map(line => {
      const cols = []; let cur = '', inQ = false;
      for (let i = 0; i < line.length; i++) {
        const ch = line[i];
        if (ch === '"') { if (inQ && line[i+1]==='"') { cur+='"'; i++; } else inQ=!inQ; }
        else if (ch===',' && !inQ) { cols.push(cur.trim()); cur=''; }
        else cur+=ch;
      }
      cols.push(cur.trim());
      const row = {};
      headers.forEach((h,i) => { row[h]=(cols[i]||'').replace(/^"|"$/g,'').trim(); });
      return row;
    }).filter(r => r[headers[0]] && r[headers[0]].trim()!=='');
  }

  /* ── 색상 헬퍼 ── */
  function statusCls(val) {
    if (val==='진행중') return 'proceeding';
    if (val==='완료')   return 'complete';
    return 'waiting';
  }
  function badgeCls(val) {
    if (val==='진행중') return 'badge-proceeding';
    if (val==='완료')   return 'badge-complete';
    return 'badge-waiting';
  }
  /* ── 세그먼트 활성 클래스 맵 ── */
  const SEG_CLS = { '대기':'active-wait', '진행중':'active-proc', '완료':'active-done' };

  function setSegValue(container, val) {
    container.querySelectorAll('.seg-btn').forEach(b => {
      b.className = 'seg-btn' + (b.dataset.val === val ? ' ' + (SEG_CLS[val]||'') : '');
    });
  }
  function getSegValue(container) {
    const active = container.querySelector('.seg-btn[class*="active-"]');
    return active ? active.dataset.val : '대기';
  }

  /* ── 헤더 뱃지 업데이트 ── */
  function updateHeaders(delphiNoRows) {
    const map = {};
    delphiNoRows.forEach(r => { map[r['Delphi_no']] = r['check'] || '대기'; });
    DELPHI_KEYS.forEach((key, i) => {
      const check = map[key] || '대기';
      const seg = document.getElementById('hdrSeg' + (i+1));
      if (seg) setSegValue(seg, check);
    });
  }

  /* ── 행 렌더링 ── */
  function makeRow(panel) {
    const tr = document.createElement('tr');
    tr.dataset.no = panel['panel_no'];

    const tdP = document.createElement('td');
    tdP.className = 'td-panel';
    tdP.textContent = panel['panel_no'];
    tr.appendChild(tdP);

    const tdE = document.createElement('td');
    tdE.className = 'td-email';
    tdE.textContent = panel['e-mail'];
    tr.appendChild(tdE);

    STATUS_KEYS.forEach((key, si) => {
      const round = si + 1;
      const val   = panel[key] || '대기';

      const td = document.createElement('td');
      td.className = 'td-status';

      // 상태 텍스트 (중앙 정렬)
      const span = document.createElement('span');
      span.className = `status-text status-col-${round} ${statusCls(val)}`;
      span.textContent = val;
      td.appendChild(span);
      tr.appendChild(td);
    });

    const tdAct = document.createElement('td');
    tdAct.className = 'td-action';
    const btnMod = document.createElement('button');
    btnMod.className = 'btn-modify'; btnMod.textContent = '수정';
    btnMod.addEventListener('click', () => openModModal(panel));
    const btnDel = document.createElement('button');
    btnDel.className = 'btn-delete'; btnDel.textContent = '삭제';
    btnDel.addEventListener('click', () => openDelModal(panel['panel_no'], panel['e-mail']));
    tdAct.appendChild(btnMod); tdAct.appendChild(btnDel);
    tr.appendChild(tdAct);

    return tr;
  }

  /* ── 헤더 세그먼트 이벤트 ── */
  const hdrOriginal = {}; // { 1:'대기', 2:'진행중', ... } 로드 시 초기값 저장

  [1,2,3,4,5].forEach(r => {
    const seg = document.getElementById('hdrSeg' + r);
    if (seg) seg.addEventListener('click', e => {
      const btn = e.target.closest('.seg-btn');
      if (!btn) return;
      setSegValue(seg, btn.dataset.val);
    });
  });

  /* ── 변경사항 없음 모달 ── */
  const noChangeOverlay = document.getElementById('noChangeOverlay');
  document.getElementById('noChangeOk').addEventListener('click', () => noChangeOverlay.classList.remove('active'));
  noChangeOverlay.addEventListener('click', e => { if (e.target === noChangeOverlay) noChangeOverlay.classList.remove('active'); });

  /* ── 통합 저장 ── */
  document.getElementById('btnSaveAll').addEventListener('click', async () => {
    // 변경된 라운드 찾기
    const changed = [];
    [1,2,3,4,5].forEach(r => {
      const seg = document.getElementById('hdrSeg' + r);
      if (!seg) return;
      const val = getSegValue(seg);
      if (val !== (hdrOriginal[r] || '')) {
        changed.push({ round: r, value: val });
      }
    });

    if (changed.length === 0) {
      noChangeOverlay.classList.add('active');
      return;
    }

    const btn = document.getElementById('btnSaveAll');
    btn.disabled = true; btn.textContent = '설정 중...';
    try {
      for (const item of changed) {
        // 1) delphi_no 탭 저장
        const result = await gasCall({ action: 'updateDelphiNo', round: item.round, check: item.value });
        if (result.status !== 'ok') throw new Error(result.message);

        // 2) 대기/진행중이면 패널 일괄 변경 (완료 패널 보호)
        if (item.value !== '완료') {
          const bulkRes = await gasCall({ action: 'bulkUpdatePanelStatus', round: item.round, status: item.value });
          if (bulkRes.status !== 'ok') throw new Error(bulkRes.message);

          // 화면 갱신
          document.querySelectorAll('#tableBody tr').forEach(tr => {
            if (!tr.dataset.no) return;
            const span = tr.querySelector(`.status-col-${item.round}`);
            if (!span) return;
            if (span.textContent.trim().startsWith('완료')) return;
            span.textContent = item.value;
            span.className = `status-text status-col-${item.round} ${statusCls(item.value)}`;
          });
        }

        // 초기값 갱신
        hdrOriginal[item.round] = item.value;
      }

      btn.textContent = '설정 완료 ✓';
      setTimeout(() => { btn.textContent = '변경사항 저장'; btn.disabled = false; }, 1800);
    } catch(e) {
      alert('저장 실패: ' + e.message);
      btn.textContent = '변경사항 저장'; btn.disabled = false;
    }
  });

  /* ── 데이터 로드 ── */
  const loadingOverlay = document.getElementById('loadingOverlay');

  async function loadAll() {
    // 스크롤 맨 위로, 표 비우고, 로딩 오버레이 표시
    window.scrollTo({ top: 0, behavior: 'instant' });
    const tbody = document.getElementById('tableBody');
    tbody.innerHTML = '';
    loadingOverlay.classList.add('active');
    try {
      const [panelRows, delphiNoRows] = await Promise.all([fetchCSV(PANEL_CSV), fetchCSV(DELPHI_NO_CSV)]);
      updateHeaders(delphiNoRows);
      // 세그먼트 초기값 저장 (변경 감지용)
      [1,2,3,4,5].forEach(r => {
        const seg = document.getElementById('hdrSeg' + r);
        if (seg) hdrOriginal[r] = getSegValue(seg);
      });
      const filtered = panelRows.filter(r => r['panel_no'] && r['panel_no'].trim() !== '');
      console.log('[loadAll] 첫 번째 패널:', filtered[0]);
      if (filtered.length === 0) {
        tbody.innerHTML = '<tr class="state-row"><td colspan="8">등록된 패널이 없습니다.</td></tr>';
      } else {
        filtered.forEach(p => tbody.appendChild(makeRow(p)));
      }
    } catch(e) {
      tbody.innerHTML = `<tr class="state-row"><td colspan="8">로드 실패: ${e.message}</td></tr>`;
    } finally {
      loadingOverlay.classList.remove('active');
    }
  }


  /* ── Reload ── */
  document.getElementById('btnReload').addEventListener('click', () => loadAll());

  /* ── 돌아가기 ── */
  document.getElementById('btnBack').addEventListener('click', () => {
    location.href = 'admin_mng-intro.html';
  });

  /* ── 패널 추가 ── */
  const addOverlay = document.getElementById('addOverlay');
  const addMsgEl   = document.getElementById('addMsg');
  const addConfirm = document.getElementById('addConfirm');

  document.getElementById('btnAddPanel').addEventListener('click', () => {
    document.getElementById('addEmail').value=''; document.getElementById('addEtc').value='';
    addMsgEl.textContent=''; addMsgEl.className='modal-msg';
    addOverlay.classList.add('active');
    setTimeout(()=>document.getElementById('addEmail').focus(), 80);
  });
  document.getElementById('addCancel').addEventListener('click', ()=>addOverlay.classList.remove('active'));
  addOverlay.addEventListener('click', e=>{ if(e.target===addOverlay) addOverlay.classList.remove('active'); });

  addConfirm.addEventListener('click', async () => {
    const email=document.getElementById('addEmail').value.trim();
    const etc  =document.getElementById('addEtc').value.trim();
    if (!email||!email.includes('@')) {
      addMsgEl.textContent='올바른 이메일 주소를 입력해주세요.'; addMsgEl.className='modal-msg err'; return;
    }
    addConfirm.disabled=true; addConfirm.textContent='추가 중…'; addMsgEl.textContent='';
    try {
      const result=await gasCall({action:'addPanel',email,etc});
      if (result.status==='ok') {
        addMsgEl.textContent='패널이 추가되었습니다.'; addMsgEl.className='modal-msg ok';
        setTimeout(async()=>{ addOverlay.classList.remove('active'); await loadAll(); }, 800);
      } else { addMsgEl.textContent='추가 실패: '+result.message; addMsgEl.className='modal-msg err'; }
    } catch(e) { addMsgEl.textContent='오류: '+e.message; addMsgEl.className='modal-msg err'; }
    finally { addConfirm.disabled=false; addConfirm.textContent='추가'; }
  });
  document.getElementById('addEmail').addEventListener('keydown', e=>{ if(e.key==='Enter') addConfirm.click(); });

  /* ── 패널 정보 수정 ── */
  const modOverlay=document.getElementById('modOverlay');
  const modMsgEl  =document.getElementById('modMsg');
  const modConfirm=document.getElementById('modConfirm');

  function openModModal(panel) {
    document.getElementById('modNo').value    = panel['panel_no']||'';
    document.getElementById('modEmail').value = panel['e-mail']  ||'';
    document.getElementById('modEtc').value   = panel['etc']     ||'';
    modMsgEl.textContent=''; modMsgEl.className='modal-msg';
    modOverlay.classList.add('active');
    setTimeout(()=>document.getElementById('modEmail').focus(), 80);
  }
  document.getElementById('modCancel').addEventListener('click', ()=>modOverlay.classList.remove('active'));
  modOverlay.addEventListener('click', e=>{ if(e.target===modOverlay) modOverlay.classList.remove('active'); });

  modConfirm.addEventListener('click', async () => {
    const panelNo=document.getElementById('modNo').value;
    const email  =document.getElementById('modEmail').value.trim();
    const etc    =document.getElementById('modEtc').value.trim();
    if (!email||!email.includes('@')) {
      modMsgEl.textContent='올바른 이메일 주소를 입력해주세요.'; modMsgEl.className='modal-msg err'; return;
    }
    modConfirm.disabled=true; modConfirm.textContent='저장 중…'; modMsgEl.textContent='';
    try {
      const result=await gasCall({action:'modifyPanel',panel_no:panelNo,email,etc});
      if (result.status==='ok') {
        modMsgEl.textContent='수정되었습니다.'; modMsgEl.className='modal-msg ok';
        const tr=document.querySelector(`#tableBody tr[data-no="${panelNo}"]`);
        if (tr) tr.querySelector('.td-email').textContent=email;
        setTimeout(()=>modOverlay.classList.remove('active'), 800);
      } else { modMsgEl.textContent='수정 실패: '+result.message; modMsgEl.className='modal-msg err'; }
    } catch(e) { modMsgEl.textContent='오류: '+e.message; modMsgEl.className='modal-msg err'; }
    finally { modConfirm.disabled=false; modConfirm.textContent='저장'; }
  });

  /* ── 패널 상태 수정 ── */
  const stOverlay=document.getElementById('stOverlay');
  const stMsgEl  =document.getElementById('stMsg');
  const stConfirm=document.getElementById('stConfirm');
  let stPanelNo=null, stRound=null, stSpan=null;

  const stSegCtrl = document.getElementById('stSegCtrl');
  stSegCtrl.addEventListener('click', e => {
    const btn = e.target.closest('.seg-btn');
    if (!btn) return;
    setSegValue(stSegCtrl, btn.dataset.val);
  });

  function openStModal(panelNo, round, currentVal, span) {
    stPanelNo=panelNo; stRound=round; stSpan=span;
    document.getElementById('stTitle').textContent = `${ROUND_LABELS[round-1]} 상태 수정`;
    document.getElementById('stNo').value = panelNo;
    // 현재 상태값 세그먼트에 반영
    setSegValue(stSegCtrl, currentVal || '대기');
    stMsgEl.textContent=''; stMsgEl.className='modal-msg';
    stOverlay.classList.add('active');
  }
  document.getElementById('stCancel').addEventListener('click', ()=>{ stOverlay.classList.remove('active'); stPanelNo=null; });
  stOverlay.addEventListener('click', e=>{ if(e.target===stOverlay){ stOverlay.classList.remove('active'); stPanelNo=null; } });

  stConfirm.addEventListener('click', async () => {
    if (!stPanelNo||!stRound) return;
    const newStatus=getSegValue(stSegCtrl);
    stConfirm.disabled=true; stConfirm.textContent='저장 중…'; stMsgEl.textContent='';
    try {
      const result=await gasCall({action:'updatePanelStatus',panel_no:stPanelNo,round:stRound,status:newStatus});
      if (result.status==='ok') {
        stMsgEl.textContent='저장되었습니다.'; stMsgEl.className='modal-msg ok';
        if (stSpan) {
          stSpan.textContent=newStatus;
          stSpan.className=`status-text status-col-${stRound} ${statusCls(newStatus)}`;
          // 수정 버튼 클릭 시 현재값 갱신을 위해 btn의 closure도 업데이트 필요 → span 참조로 처리됨
        }
        setTimeout(()=>{ stOverlay.classList.remove('active'); stPanelNo=null; }, 800);
      } else { stMsgEl.textContent='저장 실패: '+result.message; stMsgEl.className='modal-msg err'; }
    } catch(e) { stMsgEl.textContent='오류: '+e.message; stMsgEl.className='modal-msg err'; }
    finally { stConfirm.disabled=false; stConfirm.textContent='저장'; }
  });

  /* ── 패널 삭제 ── */
  const delOverlay=document.getElementById('delOverlay');
  let pendingDelNo=null;

  function openDelModal(panelNo, email) {
    pendingDelNo=panelNo;
    document.getElementById('delMsg').textContent=`"${email}" 패널을 삭제하시겠습니까?`;
    delOverlay.classList.add('active');
  }
  document.getElementById('delCancel').addEventListener('click', ()=>{ delOverlay.classList.remove('active'); pendingDelNo=null; });
  delOverlay.addEventListener('click', e=>{ if(e.target===delOverlay){ delOverlay.classList.remove('active'); pendingDelNo=null; } });

  document.getElementById('delConfirm').addEventListener('click', async () => {
    if (!pendingDelNo) return;
    const btn=document.getElementById('delConfirm');
    btn.disabled=true; btn.textContent='삭제 중…';
    try {
      const result=await gasCall({action:'deletePanel',panel_no:pendingDelNo});
      if (result.status==='ok') { delOverlay.classList.remove('active'); pendingDelNo=null; await loadAll(); }
      else alert('삭제 실패: '+result.message);
    } catch(e) { alert('오류: '+e.message); }
    finally { btn.disabled=false; btn.textContent='삭제'; }
  });

  /* ESC 공통 */
  document.addEventListener('keydown', e=>{
    if (e.key==='Escape')
      [loOverlay,addOverlay,modOverlay,stOverlay,delOverlay].forEach(o=>o.classList.remove('active'));
  });

  /* 초기 로드 */
  loadAll();

  /* 변경사항 저장 버튼 크기 고정 */
  requestAnimationFrame(() => {
    const btn = document.getElementById('btnSaveAll');
    btn.style.width = btn.offsetWidth + 'px';
  });
</script>
</body>
</html>
