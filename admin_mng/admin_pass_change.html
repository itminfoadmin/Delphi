<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>관리자 비밀번호 변경</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Malgun Gothic', '맑은 고딕', 'Apple SD Gothic Neo', sans-serif;
      background-color: #f0f0f0;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 40px 20px;
    }

    .card {
      background: #fff;
      border-radius: 6px;
      width: 480px;
      max-width: 96vw;
      padding: 48px 48px 40px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.10);
    }

    .card-title {
      font-family: 'Courier New', monospace;
      font-size: 15px;
      line-height: 1.75;
      color: #555;
      text-align: center;
      margin-bottom: 36px;
    }

    .field-group { margin-bottom: 22px; }

    .field-group label {
      display: block;
      font-size: 13px;
      color: #666;
      margin-bottom: 7px;
      letter-spacing: 0.03em;
    }

    .field-group input {
      width: 100%;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 14px;
      padding: 11px 14px;
      outline: none;
      color: #333;
      background: #fafafa;
      transition: border-color .2s, background .2s;
    }
    .field-group input:focus { border-color: #888; background: #fff; }
    .field-group input::placeholder { color: #bbb; }

    .hint {
      font-size: 12px;
      color: #999;
      margin-top: 8px;
      line-height: 1.6;
    }

    .error-msg {
      font-size: 13px;
      color: #c0392b;
      min-height: 18px;
      margin-bottom: 16px;
      text-align: center;
    }

    .success-msg {
      font-size: 14px;
      color: #27ae60;
      min-height: 18px;
      margin-bottom: 16px;
      text-align: center;
    }

    .btn-row { display: flex; gap: 12px; margin-top: 8px; }

    .btn-row button {
      flex: 1;
      padding: 14px 0;
      font-size: 15px;
      font-weight: bold;
      border-radius: 4px;
      cursor: pointer;
      transition: opacity .2s;
    }
    .btn-row button:hover { opacity: .85; }
    .btn-row button:disabled { opacity: .45; cursor: default; }

    .btn-cancel  { background: #fff; border: 1.5px solid #ccc; color: #333; }
    .btn-confirm { background: #1e1e1e; border: none; color: #fff; }

    /* embed 모드: iframe 내에서 배경 투명, 카드 그림자 제거 */
    body.embed { background: transparent; padding: 20px; min-height: auto; }
    body.embed .card { box-shadow: none; padding: 32px 36px 28px; }
  </style>
</head>
<body>

<div class="card">
  <p class="card-title" id="cardTitle">
    최초 로그인 하셨습니다.<br>
    보안을 위해 로그인 비밀번호를 변경해주세요.
  </p>

  <div class="field-group">
    <label>e-mail</label>
    <input type="email" id="pcEmail" placeholder="이메일 주소를 입력해주세요." autocomplete="username" />
  </div>

  <div class="field-group">
    <label>현재 패스워드</label>
    <input type="password" id="pcCurrent" placeholder="현재 패스워드를 입력해주세요." autocomplete="current-password" />
  </div>

  <div class="field-group">
    <label>변경 패스워드</label>
    <input type="password" id="pcNew" placeholder="새로운 패스워드를 입력해주세요." autocomplete="new-password" />
  </div>

  <div class="field-group">
    <label>변경 패스워드 (확인)</label>
    <input type="password" id="pcNewConfirm" placeholder="새로운 패스워드를 입력해주세요." autocomplete="new-password" />

  </div>

  <p class="error-msg"   id="errorMsg"></p>
  <p class="success-msg" id="successMsg"></p>

  <div class="btn-row">
    <button class="btn-confirm" id="confirmBtn">확인 (Confirm)</button>
    <button class="btn-cancel"  id="cancelBtn">취소 (Cancel)</button>
  </div>
</div>

<script>
  /* ── 설정 ── */
  const GAS_URL = 'https://script.google.com/macros/s/AKfycbzDES_x1oHeiC_NbN97iCpwS4bKwY7zGTRFlp_IqmEC4wPbgpzmyDimoPSx5TQPPnfVPQ/exec';

  /* ── embed 모드 감지 ── */
  const isEmbed = new URLSearchParams(location.search).has('embed');
  if (isEmbed) {
    document.body.classList.add('embed');
    document.getElementById('cardTitle').innerHTML = '비밀번호 변경을 위해 아래 내용을 입력하고<br>[확인(Confirm)] 버튼을 클릭해주세요.';
  }

  /* ── 세션에서 이메일 자동 채우기 ── */
  const savedEmail = sessionStorage.getItem('adminEmail') || '';
  const emailInput = document.getElementById('pcEmail');
  emailInput.value = savedEmail;
  if (savedEmail) emailInput.readOnly = true;
  // 현재 패스워드 필드는 항상 빈 상태(placeholder만 표시)

  const errorEl   = document.getElementById('errorMsg');
  const successEl = document.getElementById('successMsg');
  const confirmBtn = document.getElementById('confirmBtn');
  const cancelBtn  = document.getElementById('cancelBtn');

  cancelBtn.addEventListener('click', () => {
    if (isEmbed && window.parent !== window) {
      window.parent.postMessage({ type: 'pwModalClose' }, '*');
    } else {
      location.href = 'admin_mng-intro.html';
    }
  });

  /* ── 확인 버튼 ── */
  confirmBtn.addEventListener('click', async () => {
    errorEl.textContent   = '';
    successEl.textContent = '';

    const email      = emailInput.value.trim();
    const currentPw  = document.getElementById('pcCurrent').value;
    const newPw      = document.getElementById('pcNew').value;
    const newPwConf  = document.getElementById('pcNewConfirm').value;

    // 유효성 검사
    if (!email || !currentPw || !newPw || !newPwConf) {
      errorEl.textContent = '모든 항목을 입력해주세요.'; return;
    }
    if (newPw !== newPwConf) {
      errorEl.textContent = '새 패스워드와 확인 패스워드가 일치하지 않습니다.'; return;
    }
    if (newPw === currentPw) {
      errorEl.textContent = '새 패스워드는 현재 패스워드와 달라야 합니다.'; return;
    }

    confirmBtn.disabled = true;
    confirmBtn.textContent = '처리 중…';

    try {
      // 1) GAS로 현재 패스워드 검증 (CSV 캐시 문제 방지 — 항상 최신 데이터 조회)
      const verifyRes = await fetch(GAS_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action: 'verifyAdmin', email, password: currentPw }),
        redirect: 'follow'
      });
      const verifyData = await verifyRes.json();

      if (verifyData.status !== 'ok') {
        errorEl.textContent = verifyData.message || '현재 패스워드가 올바르지 않습니다.';
        return;
      }

      // 2) GAS 웹앱으로 패스워드 업데이트 요청
      const gasRes = await fetch(GAS_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action: 'changeAdminPassword', email, newPassword: newPw }),
        redirect: 'follow'
      });
      const gasData = await gasRes.json();

      if (gasData.status !== 'ok') {
        errorEl.textContent = gasData.message || '비밀번호 변경 중 오류가 발생했습니다.';
        return;
      }

      successEl.textContent = '비밀번호가 성공적으로 변경되었습니다.';
      if (isEmbed && window.parent !== window) {
        setTimeout(() => { window.parent.postMessage({ type: 'pwModalClose' }, '*'); }, 1500);
      } else {
        successEl.textContent += ' 잠시 후 관리 페이지로 이동합니다.';
        setTimeout(() => { location.href = 'admin_mng-intro.html'; }, 2000);
      }

    } catch (err) {
      errorEl.textContent = '처리 중 오류가 발생했습니다. 잠시 후 다시 시도해주세요.';
      console.error(err);
    } finally {
      confirmBtn.disabled = false;
      confirmBtn.textContent = '확인 (Confirm)';
    }
  });
</script>

</body>
</html>
